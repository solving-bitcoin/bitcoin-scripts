name: Research validation

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Optimize the host interpreter while retaining debug assertions and overflow
  # checks. Generated Script bytecode still follows the repository policy.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_TEST_OPT_LEVEL: 1

jobs:
  validate:
    name: Knowledge, Python, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.0
          # Preserve Cargo warning behavior; the setup action defaults to -D warnings.
          rustflags: ""
          components: rustfmt
          cache: false
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Validate knowledge schema and links
        run: python3 tools/kb.py validate
      - name: Test knowledge and Core harnesses
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  test:
    name: Locked non-field Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.0
          # Preserve Cargo warning behavior; the setup action defaults to -D warnings.
          rustflags: ""
          # The action also keys its Rust cache on the toolchain and Cargo.lock.
          cache-key: nonfield-opt1
      - name: Run locked tests without field arithmetic
        run: cargo test --locked -- --skip 'fields::'

  core:
    name: Pinned Bitcoin Core comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.0
          # Preserve Cargo warning behavior; the setup action defaults to -D warnings.
          rustflags: ""
          cache-key: core-opt1
      - name: Cache pinned Core release archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Each runner verifies the archive hash before extracting bitcoind.
          path: target/core-regtest/*.tar.gz
          key: bitcoin-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bitcoin_core_release.json') }}
      - name: Test fixture determinism and local execution contracts
        run: cargo test --locked --example core_validation_fixtures --example tapscript_signature_fixtures --example prince_validation_fixtures --example tapscript_budget_fixtures --example tapscript_csv_fixtures --example binohash_core_fixtures --example binohash_subset_fixtures --example binohash_sighash_flag_fixtures --example binohash_single_bug_anchor --example binohash_codesep_fixtures --example binohash_two_round_subsets --example pointlock_small_r_core_fixtures --example binohash_committed_point_core
      - name: Compare Tapscript resource and policy profiles
        run: python3 tools/core_regtest.py --download-core --output target/ci-reports/core-profiles.json
      - name: Compare transaction-aware signature behavior
        run: python3 tools/tapscript_signature_regtest.py --download-core --output target/ci-reports/tapscript-signatures.json
      - name: Compare complete-witness signature budgets
        run: python3 tools/tapscript_budget_regtest.py --download-core --output target/ci-reports/tapscript-budget.json
      - name: Compare five-byte CSV semantics
        run: python3 tools/tapscript_csv_regtest.py --download-core --output target/ci-reports/tapscript-csv.json
      - name: Compare confirmed-output BIP68 maturity
        run: python3 tools/tapscript_maturity_regtest.py --download-core --output target/ci-reports/tapscript-maturity.json
      - name: Compare absolute nLockTime finality
        run: python3 tools/tapscript_finality_regtest.py --download-core --output target/ci-reports/tapscript-finality.json
      - name: Validate checked PRINCEv2 spends
        run: python3 tools/prince_regtest.py --download-core --output target/ci-reports/prince.json
      - name: Validate SHAKE256 output prefix under Core consensus
        run: python3 tools/shake256_prefix_regtest.py --download-core --output target/ci-reports/shake256-prefix.json
      - name: Compare funded Binohash legacy subset behavior
        run: python3 tools/binohash_core_regtest.py --download-core --output target/ci-reports/binohash-core.json
      - name: Compare Binohash 2-of-3 subset and Script consumer
        run: python3 tools/binohash_subset_regtest.py --download-core --output target/ci-reports/binohash-subset.json
      - name: Validate reduced two-round Binohash subset composition
        run: python3 tools/binohash_two_round_regtest.py --download-core --output target/ci-reports/binohash-two-round.json
      - name: Compare all legacy sighash bytes under Core consensus and policy
        run: python3 tools/binohash_sighash_flags_regtest.py --download-core --output target/ci-reports/binohash-sighash-flags.json
      - name: Compare Binohash nine-byte SIGHASH_SINGLE anchor
        run: python3 tools/binohash_single_anchor_regtest.py --download-core --output target/ci-reports/binohash-single-anchor.json
      - name: Compare legacy CODESEPARATOR and FindAndDelete behavior
        run: python3 tools/binohash_codesep_regtest.py --download-core --output target/ci-reports/binohash-codesep.json
      - name: Compare funded G/2 small-R point lock
        run: python3 tools/pointlock_small_r_regtest.py --download-core --output target/ci-reports/pointlock-small-r.json
      - name: Validate funded committed ECDSA point lock
        run: python3 tools/binohash_committed_point_regtest.py --download-core --output target/ci-reports/binohash-committed-point.json
      - name: Upload Core comparison reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bitcoin-core-comparisons
          path: target/ci-reports/*.json
          if-no-files-found: warn
          retention-days: 14
